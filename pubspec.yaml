name: pdf_reader
description: "Papertrail PDF — a private, offline-first reader for Android and iOS."
publish_to: 'none'
version: 1.5.3+28

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  crypto: ^3.0.7
  file_picker: ^11.0.2
  pdfrx: ^2.1.5
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  package_info_plus: ^9.0.1
  share_plus: ^12.0.2
  google_mlkit_text_recognition: ^0.16.0
  wakelock_plus: ^1.4.0
  screen_brightness: ^2.1.11
  printing: ^5.14.3
  pdf: ^3.11.3
  flutter_secure_storage: ^10.3.1
  cunning_document_scanner: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
    - family: Open Sans
      fonts:
        - asset: assets/fonts/OpenSans.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Medium.ttf
          weight: 500
        - asset: assets/fonts/Lato-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/NunitoSans.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans.ttf
    - family: Roboto Condensed
      fonts:
        - asset: assets/fonts/RobotoCondensed.ttf
