name: Android build after merge

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-main
  cancel-in-progress: false

jobs:
  test-and-build:
    name: Test and build versioned APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.2'
          channel: stable
          cache: true

      - name: Install Android SDK components
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "ndk;27.0.12077973"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release

      - name: Create versioned artifact and checksum
        id: package
        shell: bash
        run: |
          VERSION="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)[[:space:]]*$/\1 \2/p' pubspec.yaml)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not parse version from pubspec.yaml" >&2
            exit 1
          fi

          read -r VERSION_NAME BUILD_NUMBER <<< "$VERSION"
          APK_NAME="Papertrail-PDF-v${VERSION_NAME}-build${BUILD_NUMBER}.apk"
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/$APK_NAME"
          sha256sum "release/$APK_NAME" > "release/$APK_NAME.sha256"

          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "artifact_name=Papertrail-PDF-v${VERSION_NAME}-build${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            release/${{ steps.package.outputs.apk_name }}
            release/${{ steps.package.outputs.apk_name }}.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Publish build summary
        shell: bash
        run: |
          {
            echo "## Android build ready"
            echo
            echo "- APK: \`${{ steps.package.outputs.apk_name }}\`"
            echo "- Artifact: \`${{ steps.package.outputs.artifact_name }}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Retention: 30 days"
            echo
            echo "This APK uses the repository's current local-testing signing configuration."
          } >> "$GITHUB_STEP_SUMMARY"
